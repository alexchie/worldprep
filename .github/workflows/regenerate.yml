name: regenerate

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "集數 id（通知信與 Drive 的 _system 資料庫中）"
        required: true
      target:
        description: "要重做的部分"
        required: true
        type: choice
        options: [title, thumbnail, script, scenes, video]
      feedback:
        description: "修改意見（scenes 請寫場景編號，例如 s012 s015）"
        required: false

permissions:
  contents: read

env:
  TIMEZONE: Asia/Taipei
  DATABASE_URL: sqlite:///data/worldprep.db
  STORAGE_ROOT: ./storage
  GOOGLE_CLIENT_SECRETS: ./secrets/client_secret.json
  GOOGLE_TOKEN_FILE: ./secrets/google_token.json
  DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
  AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'eastasia' }}
  VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'edge' }}
  IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'none' }}
  TARGET_VIDEO_LENGTH_MINUTES: ${{ vars.TARGET_VIDEO_LENGTH_MINUTES || '9' }}
  DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '15' }}
  EPISODE_BUDGET_USD: ${{ vars.EPISODE_BUDGET_USD || '12' }}
  SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  TOPIC_FALLBACK: ${{ vars.TOPIC_FALLBACK || 'skip' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: worldprep-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Motion tools (HyperFrames + Remotion)
        # 失敗也不擋製作：剪輯時會自動退回靜態地圖與一般字幕
        continue-on-error: true
        working-directory: motion
        run: |
          npm ci --no-audit --no-fund
          npx hyperframes telemetry disable || true
          npx hyperframes browser ensure
          npx remotion browser ensure
      - name: Write Google credentials
        env:
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          mkdir -p secrets data
          printf '%s' "$CLIENT_SECRET" > secrets/client_secret.json
          printf '%s' "$TOKEN" > secrets/google_token.json
      - name: Pull state from Google Drive
        run: python -m worldprep.cli ci-pull
      - name: Regenerate
        timeout-minutes: 330
        env:
          EID: ${{ inputs.episode_id }}
          TARGET: ${{ inputs.target }}
          FEEDBACK: ${{ inputs.feedback }}
        run: python -m worldprep.cli ci-regenerate "$EID" "$TARGET" --feedback "$FEEDBACK"
      - name: Push state to Google Drive
        if: always()
        run: python -m worldprep.cli ci-push
